<section class="llm-page">
  <header class="llm-hero">
    <div>
      <p class="llm-hero__eyebrow">LLM registry</p>
      <h2>Model management</h2>
      <p class="llm-hero__subtitle">
        This page is now connected to the real stage LLM registry API for list,
        create, update, delete, and validate operations.
      </p>
    </div>

    <div class="llm-hero__actions">
      <button type="button" class="ghost-button" (click)="resetFilters()">
        Reset filters
      </button>
    </div>
  </header>

  <div class="state-toast-layer" aria-live="polite">
    <p
      *ngIf="saveMessage"
      class="state-toast state-toast--success"
      [class.state-toast--visible]="saveMessageVisible"
      [class.state-toast--hiding]="!saveMessageVisible"
    >
      {{ saveMessage }}
    </p>
  </div>

  <app-llm-registry-filters
    [filters]="filters"
    [statuses]="statuses"
    (filtersChanged)="loadModels()"
  ></app-llm-registry-filters>

  <div class="content-grid">
    <app-llm-registry-list
      [models]="models"
      [loading]="loading"
      [errorMessage]="errorMessage"
      [selectedModelId]="selectedModel?.model_id || null"
      (selected)="selectModel($event)"
    ></app-llm-registry-list>

    <app-llm-registry-details
      [model]="selectedModel"
      (create)="startCreate()"
      (edit)="startEdit($event)"
      (upload)="startUpload($event)"
      (validate)="validateSelected($event)"
      (delete)="deleteSelected($event)"
    ></app-llm-registry-details>
  </div>

  <div class="modal-layer" *ngIf="formVisible" (click)="closeEditor()">
    <div class="modal-panel" (click)="$event.stopPropagation()">
      <app-llm-registry-form
        [form]="form"
        [editingModelId]="editingModelId"
        [statuses]="statuses"
        [devices]="devices"
        [accessModes]="accessModes"
        [errorMessage]="errorMessage"
        [saveMessage]="saveMessage"
        (close)="closeEditor()"
        (reset)="resetEditor()"
        (submitForm)="submitForm()"
      ></app-llm-registry-form>
    </div>
  </div>

  <div class="modal-layer" *ngIf="uploadVisible" (click)="closeUpload()">
    <div class="modal-panel modal-panel--narrow" (click)="$event.stopPropagation()">
      <app-llm-registry-upload
        [model]="uploadModelTarget"
        [form]="uploadForm"
        [devices]="devices"
        [fileName]="selectedUploadFile?.name || ''"
        (close)="closeUpload()"
        (fileSelected)="setUploadFile($event)"
        (reset)="resetUpload()"
        (submitUpload)="submitUpload()"
      ></app-llm-registry-upload>
    </div>
  </div>

  <p *ngIf="uploadMessage" class="upload-message">{{ uploadMessage }}</p>
</section>
