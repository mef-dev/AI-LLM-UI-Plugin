<section class="upload-card" *ngIf="model as current">
  <div class="section-heading">
    <div>
      <h3>Upload model archive</h3>
      <span>{{ current.display_name || current.model_name }}</span>
    </div>
    <button type="button" class="icon-button" (click)="close.emit()" aria-label="Close upload">
      Close
    </button>
  </div>

  <p class="upload-note">
    `POST /llm/{{ '{' }}id{{ '}' }}/upload` is still pending backend integration in
    the UI. The registry CRUD flow is already connected to the real API.
  </p>

  <div class="upload-grid">
    <label class="field">
      <span>ZIP archive</span>
      <input type="file" accept=".zip" (change)="onFileChange($event)" />
      <small *ngIf="fileName">Selected: {{ fileName }}</small>
    </label>

    <label class="field">
      <span>Device</span>
      <select [(ngModel)]="form.device">
        <option value="">Keep current</option>
        <option *ngFor="let device of devices" [value]="device">{{ device }}</option>
      </select>
    </label>

    <label class="field">
      <span>Version</span>
      <input type="text" [(ngModel)]="form.version" placeholder="2.0.0" />
    </label>
  </div>

  <div class="upload-actions">
    <button type="button" class="ghost-button" (click)="reset.emit()">
      Clear upload
    </button>
    <button type="button" class="primary-button" (click)="submitUpload.emit()" [disabled]="!fileName">
      Upload ZIP
    </button>
  </div>
</section>
