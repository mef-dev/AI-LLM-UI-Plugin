<section class="list-card">
  <div class="section-heading">
    <h3>Models</h3>
    <span>{{ models.length }} item(s)</span>
  </div>

  <p *ngIf="loading" class="state-message">Loading registry data...</p>
  <p *ngIf="errorMessage" class="state-message state-message--error">{{ errorMessage }}</p>

  <div *ngIf="!loading && !errorMessage && models.length" class="list-table">
    <button
      *ngFor="let model of models"
      type="button"
      class="model-row"
      [class.model-row--active]="selectedModelId === model.model_id"
      (click)="selectModel(model)"
    >
      <div class="model-row__main">
        <strong>{{ model.display_name || model.model_name }}</strong>
        <span>{{ model.model_name }}</span>
      </div>

      <div class="model-row__meta">
        <span class="badge" [class]="'badge--' + model.status.toLowerCase()">
          {{ model.status }}
        </span>
        <span class="meta-chip">{{ model.device || 'n/a' }}</span>
        <span class="meta-chip">{{ formatAccessMode(model.access_mode) }}</span>
      </div>
    </button>

    <button
      type="button"
      class="model-row model-row--create"
      (click)="startCreate()"
    >
      <div class="model-row__main">
        <strong>Add model</strong>
        <span>Create another registry entry directly from the list.</span>
      </div>

      <div class="model-row__create-mark" aria-hidden="true">+</div>
    </button>
  </div>

  <div *ngIf="!loading && !errorMessage && !models.length" class="empty-state">
    <h3>No models found</h3>
    <p>Adjust the filters or create a new model entry.</p>
    <button type="button" class="empty-state__action" (click)="startCreate()">Add first model</button>
  </div>
</section>
