<section
  class="parameters-card"
  (mouseleave)="clearHoverHint()"
  (focusout)="clearHintOnCardExit($event)"
>
  <div class="section-heading">
    <div>
      <h3>Model and controls</h3>
      <p>Keep the common options nearby and leave lower-level tuning collapsed until you need it.</p>
    </div>
  </div>

  <div class="hover-hint" [class.hover-hint--active]="activeHintKey !== null">
    {{ activeHintText }}
  </div>

  <div class="parameter-grid">
    <label
      class="field field--wide"
      (mouseenter)="showHint('model')"
      (focusin)="showHint('model')"
    >
      <span class="field-label">
        <span>Model</span>
      </span>
      <select [(ngModel)]="request.model" [disabled]="!availableModels.length">
        <option *ngFor="let model of availableModels" [value]="model.model_name">
          {{ model.display_name || model.model_name }} ({{ model.status }})
        </option>
      </select>
      <small class="field-hint" *ngIf="!availableModels.length">
        No registered models are available yet.
      </small>
    </label>

    <label
      class="field"
      (mouseenter)="showHint('temperature')"
      (focusin)="showHint('temperature')"
    >
      <span class="field-label">
        <span>Temperature</span>
      </span>
      <input type="number" step="0.1" [(ngModel)]="request.temperature" />
    </label>

    <label
      class="field"
      (mouseenter)="showHint('topP')"
      (focusin)="showHint('topP')"
    >
      <span class="field-label">
        <span>Top P</span>
      </span>
      <input type="number" step="0.1" [(ngModel)]="request.top_p" />
    </label>

    <label
      class="field"
      (mouseenter)="showHint('maxTokens')"
      (focusin)="showHint('maxTokens')"
    >
      <span class="field-label">
        <span>Max tokens</span>
      </span>
      <input type="number" [(ngModel)]="request.max_tokens" />
    </label>

    <label
      class="field field--toggle"
      (mouseenter)="showHint('stream')"
      (focusin)="showHint('stream')"
    >
      <input type="checkbox" [(ngModel)]="request.stream" />
      <div>
        <span class="field-label">
          <span>Stream response</span>
        </span>
      </div>
    </label>
  </div>

  <details class="advanced-panel">
    <summary>Advanced controls</summary>

    <div class="advanced-panel__content">
      <div class="parameter-grid parameter-grid--advanced">
        <label
          class="field"
          (mouseenter)="showHint('tag')"
          (focusin)="showHint('tag')"
        >
          <span class="field-label">
            <span>Tag</span>
          </span>
          <input type="text" [(ngModel)]="request.tag" placeholder="demo-chat-run" />
        </label>

        <label
          class="field"
          (mouseenter)="showHint('topK')"
          (focusin)="showHint('topK')"
        >
          <span class="field-label">
            <span>Top K</span>
          </span>
          <input type="number" [(ngModel)]="request.top_k" />
        </label>

        <label
          class="field"
          (mouseenter)="showHint('streamInterval')"
          (focusin)="showHint('streamInterval')"
        >
          <span class="field-label">
            <span>Stream interval</span>
          </span>
          <input type="number" step="0.1" [(ngModel)]="request.stream_interval" />
        </label>
      </div>

      <p class="advanced-note">
        These fields are mainly for lower-level request testing. The defaults above are enough for most prompt checks.
      </p>
    </div>
  </details>
</section>
