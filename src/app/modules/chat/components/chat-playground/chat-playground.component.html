<section class="chat-page">
  <app-chat-playground-hero
    (reset)="resetConversation()"
    (send)="sendCompletion()"
  ></app-chat-playground-hero>

  <app-chat-request-settings [request]="request"></app-chat-request-settings>

  <div class="content-grid">
    <app-chat-messages-editor
      [messages]="request.messages"
      [roles]="roles"
      [errorMessage]="errorMessage"
      (addUserMessage)="addUserMessage()"
      (removeMessage)="removeMessage($event)"
    ></app-chat-messages-editor>

    <app-chat-response-preview
      [request]="request"
      [response]="response"
      [loading]="loading"
      [successMessage]="successMessage"
    ></app-chat-response-preview>
  </div>
</section>
