<section class="chat-page">
  <header class="chat-hero">
    <div>
      <p class="chat-hero__eyebrow">Chat completions</p>
      <h2>Mocked `POST /chat/completions`</h2>
      <p class="chat-hero__subtitle">
        This page uses the documented request body shape from
        <code>API_DOCUMENTATION.md</code> and sends it to a fake service. The UI
        behaves as if a real chat completion endpoint exists.
      </p>
    </div>

    <div class="chat-hero__actions">
      <button type="button" class="ghost-button" (click)="resetConversation()">
        Reset conversation
      </button>
      <button type="button" class="primary-button" (click)="sendCompletion()">
        Send mocked request
      </button>
    </div>
  </header>

  <app-chat-request-settings [request]="request"></app-chat-request-settings>

  <div class="content-grid">
    <app-chat-messages-editor
      [messages]="request.messages"
      [roles]="roles"
      [errorMessage]="errorMessage"
      (addUserMessage)="addUserMessage()"
      (removeMessage)="removeMessage($event)"
    ></app-chat-messages-editor>

    <app-chat-response-preview
      [request]="request"
      [response]="response"
      [loading]="loading"
      [successMessage]="successMessage"
    ></app-chat-response-preview>
  </div>
</section>
