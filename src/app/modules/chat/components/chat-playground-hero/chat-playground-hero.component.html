<header class="chat-hero">
  <div class="chat-hero__content">
    <p class="chat-hero__eyebrow">Chat workspace</p>
    <div class="chat-hero__title-row">
      <h2>Prompt testing and response preview</h2>
      <span class="status-chip status-chip--pending">Backend model pending</span>
    </div>
    <p class="chat-hero__subtitle">
      Prepare prompt flows and inspect the request shape while stage chat-capable models are still being finalized.
    </p>
  </div>

  <div class="chat-hero__actions">
    <button type="button" class="ghost-button" (click)="reset.emit()">
      Reset conversation
    </button>
  </div>
</header>
