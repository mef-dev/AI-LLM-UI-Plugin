<header class="chat-hero">
  <div>
    <p class="chat-hero__eyebrow">Chat completions</p>
    <h2>Mocked `POST /chat/completions`</h2>
    <p class="chat-hero__subtitle">
      This page uses the documented request body shape from
      <code>API_DOCUMENTATION.md</code> and sends it to a fake service. The UI
      behaves as if a real chat completion endpoint exists.
    </p>
  </div>

  <div class="chat-hero__actions">
    <button type="button" class="ghost-button" (click)="reset.emit()">
      Reset conversation
    </button>
  </div>
</header>
