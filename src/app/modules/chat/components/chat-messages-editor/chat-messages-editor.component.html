<section class="conversation-card">
  <div class="section-heading">
    <h3>Messages array</h3>
    <button type="button" class="ghost-button" (click)="addUserMessage.emit()">
      Add user message
    </button>
  </div>

  <p *ngIf="errorMessage" class="state-message state-message--error">{{ errorMessage }}</p>

  <div class="message-list">
    <article class="message-card" *ngFor="let message of messages; let i = index">
      <div class="message-card__toolbar">
        <label class="field">
          <span>Role</span>
          <select [(ngModel)]="message.role">
            <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
          </select>
        </label>

        <button
          type="button"
          class="ghost-button"
          (click)="removeMessage.emit(i)"
          [disabled]="messages.length === 1"
        >
          Remove
        </button>
      </div>

      <label class="field">
        <span>Content</span>
        <textarea [(ngModel)]="message.content"></textarea>
      </label>
    </article>
  </div>
</section>
